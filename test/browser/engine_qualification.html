<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pattern C Engine Qualification Harness</title>
</head>
<body>
  <h1>KataGo Web Pattern C Qualification Harness</h1>
  <div id="status">Initializing...</div>
  <pre id="log"></pre>

  <script type="module">
    import { createEngine } from '/dist/client/engine.js';
    import { BASELINE_B10C384_MANIFEST } from '/dist/models/manifest.js';

    window.qualResults = {
      test1_opening: null,
      test2_cancel: null,
      test3_reuse: null,
      test4_multiRun: null,
      finished: false,
      success: false,
      errors: [],
    };

    function log(msg) {
      console.log('[QUAL]', msg);
      document.getElementById('status').innerText = typeof msg === 'string' ? msg : JSON.stringify(msg);
      document.getElementById('log').textContent += (typeof msg === 'string' ? msg : JSON.stringify(msg)) + '\n';
    }

    async function runQualification() {
      try {
        log('Creating KataGo engine for qualification...');
        const engine = createEngine({
          workerFactory: () => new Worker('/dist/worker/coordinator.worker.js', { type: 'module' }),
        });

        // 1. Initialize
        log('Initializing engine with b10c384 model...');
        const info = await engine.initialize({
          operationId: 'qual-init',
          model: { kind: 'manifest', manifest: BASELINE_B10C384_MANIFEST },
          runtime: { accelerator: 'webgpu', fallback: 'forbid' },
        });
        log('Engine initialized successfully.');

        // ==========================================
        // TEST 1: Opening Position with Real Moves
        // ==========================================
        log('Running Test 1: Standard 4-move opening position...');
        const req1 = {
          apiVersion: 1,
          requestId: 'qual-pos-1',
          position: {
            kind: 'game',
            dimensions: { width: 19, height: 19 },
            initialStones: [],
            initialPlayer: 'black',
            moves: [
              { player: 'black', move: { kind: 'play', point: { x: 15, y: 3 } } },  // Q16
              { player: 'white', move: { kind: 'play', point: { x: 3, y: 15 } } },  // D4
              { player: 'black', move: { kind: 'play', point: { x: 15, y: 15 } } }, // Q4
              { player: 'white', move: { kind: 'play', point: { x: 3, y: 3 } } },   // D16
            ],
            rules: { kind: 'preset', name: 'japanese' },
            komi: 6.5,
            handicap: { countOverride: null, inferFromInitialBlackMoves: false },
          },
          search: {
            profile: 'upstream-analysis-v1',
            limits: { kind: 'visits', maxVisits: 15 },
            seed: 'qual-seed-1',
            batchSize: 4,
            searchThreads: 2,
            conservativePass: false,
            wideRootNoise: 0,
            rootSymmetrySamples: 1,
            allowedRootMoves: null,
          },
          output: {
            maxCandidates: 5,
            pvLength: 6,
            includePolicy: true,
            ownership: 'root',
            includeOwnershipStdev: false,
            includeCandidateOwnership: false,
            progressIntervalMs: 50,
          },
        };

        const res1 = await engine.analyze(req1);
        log(`Test 1 completed with ${res1.snapshot.rootVisits} visits.`);
        window.qualResults.test1_opening = res1;

        // Verify occupied points are NOT top candidate
        const topMove = res1.snapshot.candidates[0].move;
        if (topMove.kind === 'play') {
          const pt = topMove.point;
          const isOccupied = (pt.x === 15 && pt.y === 3) || (pt.x === 3 && pt.y === 15) ||
                             (pt.x === 15 && pt.y === 15) || (pt.x === 3 && pt.y === 3);
          if (isOccupied) {
            throw new Error(`Top move (${pt.x}, ${pt.y}) is on already occupied corner point!`);
          }
        }

        // ==========================================
        // TEST 2: Active Cancellation During Search
        // ==========================================
        log('Running Test 2: Active Cancellation...');
        const req2 = {
          apiVersion: 1,
          requestId: 'qual-cancel-1',
          position: {
            kind: 'game',
            dimensions: { width: 19, height: 19 },
            initialStones: [],
            initialPlayer: 'black',
            moves: [],
            rules: { kind: 'preset', name: 'chinese' },
            komi: 7.5,
            handicap: { countOverride: null, inferFromInitialBlackMoves: false },
          },
          search: {
            profile: 'upstream-analysis-v1',
            limits: { kind: 'visits', maxVisits: 500 }, // High limit to allow in-flight cancel
            seed: 'qual-seed-2',
            batchSize: 4,
            searchThreads: 2,
            conservativePass: false,
            wideRootNoise: 0,
            rootSymmetrySamples: 1,
            allowedRootMoves: null,
          },
          output: {
            maxCandidates: 5,
            pvLength: 5,
            includePolicy: false,
            ownership: 'none',
            includeOwnershipStdev: false,
            includeCandidateOwnership: false,
            progressIntervalMs: 20,
          },
        };

        let progressCount = 0;
        const unsubscribe = engine.subscribe((e) => {
          if (e.type === 'analysis-progress') {
            progressCount++;
            if (progressCount === 2) {
              log('Received 2 progress events; dispatching cancel now...');
              const tCancelStart = performance.now();
              engine.cancel('qual-cancel-1').then(() => {
                const cancelLatency = performance.now() - tCancelStart;
                log(`Cancel resolved in ${cancelLatency.toFixed(1)} ms.`);
                window.qualResults.test2_cancel = { latencyMs: cancelLatency };
              });
            }
          }
        });

        const cancelAnalyzePromise = engine.analyze(req2);
        const res2 = await cancelAnalyzePromise;
        unsubscribe();
        log(`Test 2 search halted at ${res2.snapshot.rootVisits} visits (far below requested 500).`);

        // ==========================================
        // TEST 3: Immediate Reuse After Cancellation
        // ==========================================
        log('Running Test 3: Verifying bot remains immediately reusable after cancel...');
        const req3 = {
          ...req1,
          requestId: 'qual-reuse-1',
          search: {
            ...req1.search,
            limits: { kind: 'visits', maxVisits: 10 },
          },
        };

        const res3 = await engine.analyze(req3);
        log(`Test 3 completed with ${res3.snapshot.rootVisits} visits.`);
        window.qualResults.test3_reuse = res3;

        // ==========================================
        // TEST 4: Consecutive Multi-Run Stability
        // ==========================================
        log('Running Test 4: Consecutive multi-run stability (3 runs)...');
        for (let i = 0; i < 3; i++) {
          const reqMulti = {
            ...req1,
            requestId: `qual-multi-${i}`,
            search: {
              ...req1.search,
              limits: { kind: 'visits', maxVisits: 10 },
            },
          };
          const res = await engine.analyze(reqMulti);
          log(`Multi-run ${i + 1}/3 complete (${res.snapshot.rootVisits} visits).`);
        }
        window.qualResults.test4_multiRun = { runsCompleted: 3 };

        // Dispose
        log('Disposing engine...');
        await engine.dispose();
        log('All qualification tests completed successfully!');

        window.qualResults.success = true;
      } catch (err) {
        log('Qualification error: ' + (err.stack || err.message));
        window.qualResults.errors.push(err.message || String(err));
        window.qualResults.success = false;
      } finally {
        window.qualResults.finished = true;
      }
    }

    runQualification();
  </script>
</body>
</html>
